name: kosdekat
description: Aplikasi pencarian kos di sekitar Telkom University.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  google_fonts: ^6.2.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/kosdekat_logo.png
    - assets/kos_illustration.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/kosdekat_logo.png
  min_sdk_android: 21
